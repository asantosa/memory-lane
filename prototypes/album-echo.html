<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Album Echo · A little closer to yesterday</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap');
:root{--bg:#f7f3eb;--panel:#efede2;--ink:#303c33;--muted:#6f7569;--accent:#425c45;--on:#fffdf7;--card:#fffdf7;--line:#ddded1;--soft:#e9ecdf;--radius:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'DM Sans',sans-serif}button,input,textarea{font:inherit}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #be744a;outline-offset:4px}button{transition:transform .15s,background .2s}button:active{transform:translateY(1px)}a{color:inherit;text-decoration:none}#app{display:grid;grid-template-columns:268px minmax(0,1fr);max-width:1600px;margin:auto;min-height:100vh}aside{background:var(--panel);padding:32px 26px;display:flex;flex-direction:column;border-right:1px solid var(--line)}.logo{font-family:'Libre Caslon Display',Georgia,serif;font-size:29px;display:flex;align-items:center;gap:8px;white-space:nowrap}.mark{font-size:20px;background:var(--accent);color:var(--on);border-radius:50%;width:33px;height:33px;display:grid;place-items:center}.dot{font:24px Georgia;color:#a57d52;margin-left:auto}.sidebar-body{margin-top:65px}.tiny{font-size:9px;letter-spacing:1.7px;font-weight:600}.sidebar-body>.tiny{font-size:8px;color:var(--muted)}nav{margin:20px 0 22px;display:grid;gap:6px}nav button{display:flex;gap:14px;border:0;background:none;text-align:left;padding:12px 13px;border-radius:10px;color:var(--muted)}nav button.active{background:var(--soft);color:var(--ink);font-weight:600}.add-button{width:100%;background:var(--accent);color:var(--on);border:0;border-radius:10px;padding:13px}.style-section{margin-top:58px;border-top:1px solid var(--line);padding-top:26px}.style-section h3{font-family:'Libre Caslon Display',Georgia,serif;font-size:27px;font-weight:400;margin:10px 0 0}.style-section p{color:var(--muted);font-size:11px;margin:4px 0 20px}.personalities{display:grid;gap:8px}.personalities button{display:grid;grid-template-columns:35px 1fr;text-align:left;border:1px solid transparent;border-radius:11px;background:transparent;padding:9px}.personalities button[aria-pressed=true]{border-color:var(--accent);background:var(--card)}.personalities button>span{grid-row:span 2;font-size:23px;align-self:center}.personalities b{font-size:12px;font-weight:500}.personalities small{font-size:10px;color:var(--muted)}.private-note{margin-top:auto;padding-top:45px;color:var(--muted);font-size:11px}.private-note small{font-size:9px}main{padding:30px 6vw 20px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:2px;color:var(--muted)}.profile{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font:italic 19px Georgia}.intro{margin:44px 0 26px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font:400 clamp(45px,5vw,72px)/1.02 'Libre Caslon Display',Georgia,serif;letter-spacing:-2px;margin:13px 0 16px}h1 em{font-weight:400;color:var(--accent)}p{color:var(--muted)}.intro p{font-size:13px}.home-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(240px,.8fr);gap:38px;align-items:start}.memory-card{background:var(--card);padding:15px 15px 19px;box-shadow:0 8px 28px #343e2910;transform:rotate(-2deg);position:relative;margin:13px 0 25px;max-width:540px}.memory-card:before{content:'';position:absolute;width:98px;height:28px;background:#d5c19b9c;left:calc(50% - 49px);top:-13px;transform:rotate(5deg);z-index:1}.landscape{height:290px;overflow:hidden;border-radius:3px;position:relative;background:linear-gradient(#b5c5bc 0%,#ded8ba 47%,#b9c9bd 48%,#7c9b90 70%,#3f6258 100%)}.landscape:before{content:'';position:absolute;inset:0;background:linear-gradient(145deg,transparent 0 45%,#53756a 45% 65%,transparent 65%),linear-gradient(220deg,transparent 0 46%,#6c8674 46% 70%,transparent 70%);clip-path:polygon(0 0,100% 0,100% 66%,0 66%)}.landscape:after{content:'';position:absolute;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent 0 18px,#eee5c91c 19px 20px);opacity:.7}.landscape .sun{position:absolute;top:28px;right:25%;height:32px;width:32px;background:#f1e7c4;border-radius:50%;box-shadow:0 0 45px #f1e7c455}.landscape .boat{position:absolute;left:45%;bottom:24%;width:54px;height:9px;background:#433b2f;border-radius:0 0 100% 100%;z-index:1}.landscape .boat:before{content:'';position:absolute;width:2px;height:39px;background:#514a39;left:23px;bottom:8px}.landscape .boat:after{content:'';position:absolute;left:26px;bottom:10px;border-left:22px solid #e8dfc4;border-top:30px solid transparent}.image-caption{font-size:9px;position:absolute;left:10px;bottom:8px;background:#f5f1e3e8;color:#3e4a40;padding:2px 7px;border-radius:4px;z-index:2}.photo{display:block;width:100%;height:290px;object-fit:cover;border-radius:3px}.memory-caption{display:flex;justify-content:space-between;align-items:center;padding:16px 3px 0;gap:8px}.handwriting{font:italic 23px Georgia,serif}.memory-caption small{font-size:9px;color:var(--muted);white-space:nowrap}.pill{display:inline-block;padding:4px 9px;background:var(--soft);border-radius:20px;font-size:9px;color:var(--accent)}.moment-label{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--muted)}.primary{display:flex;justify-content:space-between;align-items:center;gap:18px;width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--on);padding:15px 19px;font-size:13px}.primary span{font-size:20px}.under-button{font-size:10px;text-align:center;margin:9px 0;color:var(--muted)}.prompt-card{border:1px solid var(--line);border-radius:var(--radius);padding:25px;margin:12px 0 24px}.prompt-card .symbol{color:#9a7c51;font:32px Georgia}.prompt-card h2{font:400 32px/1.16 'Libre Caslon Display',Georgia,serif;margin:15px 0}.prompt-card p{font-size:12px}.text-button{background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;font-size:12px;text-align:left;color:var(--accent)}.small-note{display:flex;gap:15px;padding:10px 7px}.small-note .symbol{font-size:28px;color:#a28c65}.small-note h3{font-size:12px;font-weight:500;margin:0 0 5px}.small-note p{font-size:11px;margin:0}footer{border-top:1px solid var(--line);margin-top:44px;padding-top:17px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between}footer span{font-size:8px;letter-spacing:2px}.back{border:0;background:none;color:var(--muted);padding:0;min-height:44px;font-size:12px}.reading{max-width:650px;margin:20px auto}.reading h1{font-size:57px}.reading .memory-card{transform:none;max-width:none}.reading .memory-card:before{display:none}.actions{display:flex;gap:12px;margin:18px 0}.secondary{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:13px 18px;flex:1;font-size:13px}.hint,.story-reveal{border-radius:16px;background:var(--soft);padding:20px;margin:18px 0}.hint p,.story-reveal p{margin:7px 0;color:var(--ink);white-space:pre-wrap}.story-reveal h2{font:32px 'Libre Caslon Display',Georgia,serif}.field{display:block;margin:20px 0 7px;font-size:12px}input:not([type=file]),textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:13px;font-size:16px}textarea{resize:vertical;min-height:130px}.upload{display:block;border:1px dashed var(--accent);border-radius:17px;padding:25px;text-align:center;color:var(--accent);background:var(--soft);cursor:pointer;margin:22px 0}.upload input{max-width:100%;margin-top:10px;font-size:12px}.helper{font-size:11px;color:var(--muted)}.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px}.library-grid button{text-align:left;display:block;border:0;background:var(--card);padding:12px;border-radius:12px}.library-grid .landscape,.library-grid .photo{height:190px}.library-grid h2{font:27px 'Libre Caslon Display',Georgia,serif;margin:14px 0 6px}.library-grid p{font-size:11px;margin:0}.empty{padding:30px 0}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:13px 23px;border-radius:14px;box-shadow:0 4px 20px #0002;max-width:90vw;font-size:13px;z-index:5}.form-error{color:#a23927;font-size:13px}body[data-theme=quiet]{--bg:#f3f7f6;--panel:#e6eeeb;--ink:#254743;--muted:#617772;--accent:#326a60;--soft:#dfebe6;--line:#d2dfd9;--radius:28px}body[data-theme=quiet] .memory-card{transform:none;border-radius:90px 90px 18px 18px;padding:10px;box-shadow:none}body[data-theme=quiet] .landscape,body[data-theme=quiet] .photo{border-radius:80px 80px 10px 10px}body[data-theme=quiet] .memory-card:before{display:none}body[data-theme=quiet] .memory-caption{padding:16px 14px}body[data-theme=quiet] h1{font-family:'DM Sans',sans-serif;font-size:clamp(40px,4vw,58px);letter-spacing:-2.5px;line-height:1.13}body[data-theme=quiet] .home-grid{gap:48px}body[data-theme=explorer]{--bg:#f5f0ff;--panel:#ebe2fa;--ink:#3c2b60;--muted:#78658f;--accent:#7146aa;--soft:#e9ddfa;--line:#ded0ed;--radius:25px}body[data-theme=explorer] h1{font-family:'DM Sans',sans-serif;font-weight:700;font-size:clamp(43px,4.3vw,63px)}body[data-theme=explorer] .memory-card{transform:rotate(2deg);border-radius:24px;background:#eadbfb;box-shadow:6px 6px 0 #d8c3ee}body[data-theme=explorer] .memory-card:before{display:none}body[data-theme=explorer] .landscape,body[data-theme=explorer] .photo{border-radius:15px}body[data-theme=explorer] .prompt-card{background:#f1e5ce;border:0;color:#58452c}body[data-theme=explorer] .prompt-card p{color:#756148}body[data-theme=explorer] .primary{border-radius:28px}@media(min-width:1400px){main{padding-left:90px;padding-right:90px}.home-grid{gap:55px}}@media(max-width:1050px){#app{grid-template-columns:220px 1fr}aside{padding:28px 18px}.logo{font-size:23px}main{padding:25px 35px}.home-grid{grid-template-columns:1fr;gap:12px}.home-grid>.right{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px}.memory-card{max-width:none}.sidebar-body{margin-top:45px}.landscape,.photo{height:330px}.small-note{padding:10px 0}}@media(max-width:650px){#app{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:17px 20px}.logo{font-size:27px}.dot{margin-left:auto}.sidebar-body{margin:15px 0 0}.sidebar-body>.tiny,.style-section h3,.style-section p,.private-note,.style-section>.tiny{display:none}nav{display:flex;margin:0 0 15px;gap:2px}nav button{padding:10px 9px;font-size:11px;gap:7px}.add-button{display:none}.style-section{margin:0;padding:0;border:0}.personalities{display:flex;gap:5px}.personalities button{flex:1;grid-template-columns:20px 1fr;padding:7px 5px}.personalities button>span{font-size:19px}.personalities b{font-size:10px}.personalities small{font-size:8px}main{padding:20px 24px}.intro{margin:25px 0 24px}h1{font-size:53px}.intro p{font-size:12px}.home-grid>.right{display:block}.landscape,.photo{height:260px}.memory-card{margin-top:18px}.prompt-card{margin-top:20px;padding:22px}.prompt-card h2{font-size:30px}.small-note{padding:6px 2px}.reading h1{font-size:43px}.actions{flex-wrap:wrap}.secondary{min-width:120px}footer{margin-top:30px}.reading{margin-top:10px}}
</style></head>
<body><div id="app"><aside><a class="logo" href="#home"><span class="mark">ae</span> album echo<span class="dot">✳</span></a><div class="sidebar-body"><div class="tiny">YOUR LITTLE CORNER OF THE PAST</div><nav aria-label="Main navigation"><button data-page="home">◌ <span>For you</span></button><button data-page="library">▧ <span>Your stories</span></button><button data-page="revisit">↺ <span>A gentle return</span></button></nav><button class="add-button" data-page="add">+ Add a moment</button><div class="style-section"><div class="tiny">MAKE YOURSELF AT HOME</div><h3>A little more you.</h3><p>Choose the feeling of your album.</p><div class="personalities"><button data-theme="storykeeper"><span>✿</span><b>Storykeeper</b><small>Warm & nostalgic</small></button><button data-theme="quiet"><span>◒</span><b>Quiet mind</b><small>Calm & unhurried</small></button><button data-theme="explorer"><span>✷</span><b>Explorer</b><small>Curious & colorful</small></button></div></div></div><div class="private-note">⌂ Saved only in this browser<br><small>A design prototype, made for exploring.</small></div></aside><main><header><span id="breadcrumb">YOUR DAILY PAUSE</span><span class="profile">J</span></header><div id="content"></div><footer>Little moments. A whole life. <span>ALBUM ECHO</span></footer></main></div><div id="toast" role="status" hidden></div><script>const content=document.getElementById('content');
const sample={id:'sample',title:'The summer we stood still',date:'Summer, around 1998',people:'Mum, Dad & me',story:'We rented a little boat and stayed on the lake until the light turned golden. Dad kept saying we should head back, but none of us wanted the afternoon to end.',photo:null,sample:true};
let memories=[],theme='storykeeper',storageAvailable=true;
try{memories=JSON.parse(localStorage.getItem('album-echo-memories')||'[]');if(!Array.isArray(memories))memories=[];theme=localStorage.getItem('album-echo-theme')||theme;}catch{storageAvailable=false;}
const config={storykeeper:{headline:'A little closer<br>to <em>yesterday.</em>',sub:'For the moments that made you, and the stories only you can tell.',cta:'Step back into this day',prompt:'What did home feel like when you were little?'},quiet:{headline:'One moment.<br><em>All the time you need.</em>',sub:'Settle in. Let a photo bring back whatever comes naturally.',cta:'Spend a moment here',prompt:'What small thing made you feel safe?'},explorer:{headline:'Oh, the things<br><em>you’ve lived.</em>',sub:'Find a forgotten favorite. Follow a feeling. See where it takes you.',cta:'Open a memory capsule',prompt:'What adventure would you love to relive?'}};
let page='home',selected=sample,hint=false,revealed=false,draftPhoto=null,draftTitle='',draftStory='',draftDate='',draftPeople='';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function artwork(m){return m.photo?`<img class="photo" src="${esc(m.photo)}" alt="${esc(m.title)}">`:'<div class="landscape" role="img" aria-label="Illustrated sailboat on a mountain lake"><span class="sun"></span><span class="boat"></span><span class="image-caption">Illustrated sample memory</span></div>';}
function card(m){return `<div class="memory-card">${artwork(m)}<div class="memory-caption"><span class="handwriting">${esc(m.title)}</span><small>${esc(m.date)}</small></div></div>`;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,4500);}
function navigate(next){page=next;hint=false;revealed=false;render();window.scrollTo({top:0,behavior:'instant'});}
function render(){if(!config[theme])theme='storykeeper';document.body.dataset.theme=theme;document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===theme));document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});const c=config[theme];document.getElementById('breadcrumb').textContent={home:'YOUR DAILY PAUSE',library:'YOUR LIVING ALBUM',revisit:'A GENTLE RETURN',add:'GATHER A MOMENT'}[page];
if(page==='home'){const featured=memories[0]||sample;content.innerHTML=`<section class="intro"><div class="eyebrow">A familiar feeling is waiting for you</div><h1>${c.headline}</h1><p>${c.sub}</p></section><div class="home-grid"><section><div class="moment-label"><span>A MOMENT TO COME BACK TO</span><span class="pill">${featured.sample?'A little inspiration':'From your album'}</span></div>${card(featured)}<button class="primary" data-open="${esc(featured.id)}">${c.cta}<span>↗</span></button><div class="under-button">No scores. No pressure. Just a moment for you.</div></section><div class="right"><section class="prompt-card"><div class="symbol">✳</div><div class="eyebrow">A story waiting to be told</div><h2>${c.prompt}</h2><p>A person, a smell, a favorite corner. Start with one little thing.</p><button class="text-button" data-action="prompt">Keep this little story &nbsp; ↗</button></section><div class="small-note"><span class="symbol">❧</span><div><h3>Your memories, in your words.</h3><p>“I think” and “I’m not sure” belong here, too.</p><button class="text-button" data-page="add">+ Add a moment</button></div></div></div></div>`;}
if(page==='library')content.innerHTML=`<section class="intro"><div class="eyebrow">The chapters that make you, you</div><h1>Life, in<br><em>little moments.</em></h1><p>${memories.length?`${memories.length} ${memories.length===1?'story':'stories'} gathered. So many more to tell.`:'Your album starts with one small story.'}</p><button class="text-button" data-page="add">+ Add a moment</button></section><div class="library-grid">${[...memories,sample].map(m=>`<button data-open="${esc(m.id)}">${artwork(m)}<h2>${esc(m.title)}</h2><p>${esc(m.date)}${m.sample?' · Sample memory':''}</p></button>`).join('')}</div>`;
if(page==='revisit')content.innerHTML=`<section class="reading"><button class="back" data-page="home">← Back to your day</button><div class="eyebrow">Take your time</div><h1>What comes<br><em>back to you?</em></h1><p>Notice a detail. Follow a feeling. You can skip whenever you like.</p>${card(selected)}${hint?`<div class="hint" role="status"><div class="eyebrow">A little nudge</div><p>${esc(selected.people||selected.date||'Think about where you were and who might have been beside you.')}</p></div>`:''}${revealed?`<div class="story-reveal" role="status"><div class="eyebrow">${selected.sample?'An illustrative story':'Your saved words'}</div><h2>${esc(selected.title)}</h2><p>${esc(selected.story||'This moment is waiting for its story.')}</p></div><button class="primary" data-action="finish">That was lovely <span>♡</span></button>`:`<div class="actions"><button class="secondary" data-action="hint">A little hint</button><button class="secondary" data-action="reveal">Read the story</button></div><button class="text-button" data-action="skip">Maybe another time →</button>`}</section>`;
if(page==='add')content.innerHTML=`<section class="reading"><button class="back" data-page="home">← Back to your day</button><div class="eyebrow">A photo is only the beginning</div><h1>Keep the feeling.<br><em>Tell the story.</em></h1><p>A few words are enough. You can always come back.</p><form id="memory-form"><label class="upload">${draftPhoto?'<span>Photo selected · choose another</span>':'<span>＋ Choose a photo from your life</span>'}<br><small>JPEG, PNG, WebP or GIF · up to 8 MB</small><input type="file" id="photo" accept="image/jpeg,image/png,image/webp,image/gif"></label><div id="photo-preview">${draftPhoto?`<img class="photo" src="${draftPhoto}" alt="Your selected memory photo">`:''}</div><label class="field" for="title">Give this moment a name</label><input id="title" required maxlength="100" placeholder="Sunday mornings at Grandma’s" value="${esc(draftTitle)}"><label class="field" for="date">When was it? <span class="helper">Approximate is lovely.</span></label><input id="date" maxlength="80" placeholder="Around 1998, sometime in summer" value="${esc(draftDate)}"><label class="field" for="people">Who was there? <span class="helper">Optional</span></label><input id="people" maxlength="160" placeholder="Names, nicknames, or just ‘all of us’" value="${esc(draftPeople)}"><label class="field" for="story">What would you like to remember?</label><textarea id="story" maxlength="12000" placeholder="I remember…">${esc(draftStory)}</textarea><p class="helper">Saved in this browser on this device. Clearing browser data removes these stories. Nothing is uploaded.</p><div id="form-error" class="form-error" role="alert"></div><button class="primary" type="submit">Keep this story <span>♡</span></button></form></section>`;
bindForm();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.theme){theme=b.dataset.theme;try{localStorage.setItem('album-echo-theme',theme);}catch{}render();}if(b.dataset.page)navigate(b.dataset.page);if(b.dataset.open){selected=[sample,...memories].find(m=>m.id===b.dataset.open)||sample;navigate('revisit');}if(b.dataset.action==='hint'){hint=true;render();}if(b.dataset.action==='reveal'){revealed=true;render();}if(b.dataset.action==='skip'){navigate('home');toast('Whenever you’re ready. Your memories can wait.');}if(b.dataset.action==='finish'){navigate('home');toast('A little closer to yesterday.');}if(b.dataset.action==='prompt'){draftStory='';navigate('add');}});
function bindForm(){const form=document.getElementById('memory-form');if(!form)return;for(const [id,set]of [['title',v=>draftTitle=v],['story',v=>draftStory=v],['date',v=>draftDate=v],['people',v=>draftPeople=v]])document.getElementById(id).addEventListener('input',e=>set(e.target.value));document.getElementById('photo').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const error=document.getElementById('form-error');if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)||file.size>8*1024*1024){error.textContent='Please choose a JPEG, PNG, WebP or GIF under 8 MB.';return;}error.textContent='Preparing your photo…';try{draftPhoto=await compress(file);document.getElementById('photo-preview').innerHTML=`<img class="photo" src="${draftPhoto}" alt="Your selected memory photo">`;error.textContent='';}catch{error.textContent='That photo could not be opened. Please try another.';}});form.addEventListener('submit',e=>{e.preventDefault();if(!draftTitle.trim()){document.getElementById('form-error').textContent='Give this moment a name before saving.';return;}const memory={id:crypto.randomUUID(),title:draftTitle.trim(),story:draftStory.trim(),date:draftDate.trim()||'A moment in time',people:draftPeople.trim(),photo:draftPhoto};try{if(!storageAvailable)throw new Error();localStorage.setItem('album-echo-memories',JSON.stringify([memory,...memories]));memories.unshift(memory);draftTitle='';draftStory='';draftDate='';draftPeople='';draftPhoto=null;navigate('library');toast('A little piece of your life, kept.');}catch{document.getElementById('form-error').textContent='This browser could not save the story. Storage may be full or disabled. Your words are still here.';}});}
function compress(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const scale=Math.min(1,1400/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.82));};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image decode failed'));};img.src=url;});}
render();
</script></body></html>
